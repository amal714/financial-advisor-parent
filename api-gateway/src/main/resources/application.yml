server:
  port: 8080

jwt:
  secret: "my-super-secret-key-which-must-be-at-least-32-bytes-long"
  expiration-ms: 3600000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Public Route: User Service (Authentication)
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        # Protected Route: Portfolio Service (Requires JWT)
        - id: portfolio-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/portfolio/**
          filters:
            - JwtAuthenticationFilter